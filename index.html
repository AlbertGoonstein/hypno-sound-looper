<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hypno Sound Looper</title>
<style>
  :root {
    --bg: #0f1117;
    --bg-card: rgba(26,29,40,0.70);
    --text: #e5e7eb;
    --text-secondary: #9ca3af;
    --border: rgba(255,255,255,0.08);
    --primary: #ff66b3;
    --primary-hover: #ff0099;
    --danger: #ef4444;
    --danger-hover: #dc2626;
    --success: #10b981;
    --shadow: 0 4px 24px rgba(0,0,0,0.3);
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.25);
    --radius: 14px;
    --radius-sm: 10px;
    --input-bg: rgba(20,22,32,0.70);
    --toggle-bg: rgba(55,65,81,0.70);
    --toggle-knob: #ff66b3;
    --accent-glow: rgba(255,0,153,0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
  }

  .app {
    max-width: 800px;
    margin: 0 auto;
    padding: 32px 20px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 36px;
  }

  header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  header h1 .icon-wrapper {
    display: inline-block;
    transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    transform-origin: center center;
  }

  header h1 .icon-wrapper.spinning {
    animation: iconSpin 4s linear infinite;
  }

  header h1 .icon {
    font-size: 30px;
    display: inline-block;
    animation: iconPulse 3s ease-in-out infinite;
  }

  @keyframes iconPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  @keyframes iconSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .loop-count {
    font-size: 13px;
    color: var(--text-secondary);
    background: var(--bg-card);
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    font-weight: 500;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  /* Add Loop Button */
  .add-loop-btn {
    width: 100%;
    padding: 14px;
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    background: transparent;
    color: var(--primary);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .add-loop-btn:hover {
    border-color: var(--primary);
    background: var(--accent-glow);
  }

  /* Loop Cards */
  .loop-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: box-shadow 0.2s, border-color 0.2s;
  }

  .loop-card.running {
    border-color: var(--primary);
    box-shadow: var(--shadow), 0 0 0 1px var(--accent-glow);
  }

  .loop-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .loop-title {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-secondary);
  }

  .loop-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-secondary);
  }

  .loop-card.running .status-dot {
    background: var(--success);
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .loop-controls {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
    margin-bottom: 20px;
  }

  @media (max-width: 640px) {
    .loop-controls {
      grid-template-columns: 1fr;
    }
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .control-group label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .control-group select,
  .control-group input[type="text"],
  .control-group input[type="number"] {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--input-bg);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }

  .control-group select:focus,
  .control-group input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .control-group input[type="range"] {
    width: 100%;
    height: 6px;
    -webkit-appearance: none;
    appearance: none;
    background: var(--border);
    border-radius: 3px;
    outline: none;
    margin-top: 4px;
  }

  .control-group input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--primary);
    cursor: pointer;
    border: 2px solid var(--bg-card);
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }

  .control-group input[type="range"]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--primary);
    cursor: pointer;
    border: 2px solid var(--bg-card);
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }

  .volume-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .volume-value {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    min-width: 36px;
    text-align: right;
  }

  .custom-url-row {
    margin-top: 8px;
  }

  .custom-mode-toggle {
    display: flex;
    gap: 0;
    margin-bottom: 8px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .custom-mode-btn {
    flex: 1;
    padding: 8px 12px;
    border: none;
    border-right: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }

  .custom-mode-btn:last-child {
    border-right: none;
  }

  .custom-mode-btn:hover {
    background: var(--accent-glow);
    color: var(--primary);
  }

  .custom-mode-btn.active {
    background: var(--primary);
    color: white;
  }

  .custom-url-row input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--input-bg);
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .custom-url-row input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .file-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--input-bg);
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
  }

  .file-label:hover {
    border-color: var(--primary);
    color: var(--primary);
  }

  .file-label input {
    display: none;
  }

  .file-name {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 6px;
    font-style: italic;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Custom sound info and error */
  .custom-info {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 6px;
    line-height: 1.4;
  }

  .custom-info .label {
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .custom-error {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    background: rgba(239, 68, 68, 0.12);
    border: 1px solid rgba(239, 68, 68, 0.3);
    border-radius: var(--radius-sm);
    font-size: 12px;
    color: var(--danger);
    margin-top: 8px;
  }

  .custom-error::before {
    content: '\26A0\FE0F';
    font-size: 14px;
  }

  .loop-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn-play {
    flex: 1;
    padding: 12px 20px;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-play.start {
    background: var(--primary);
    color: white;
  }

  .btn-play.start:hover {
    background: var(--primary-hover);
  }

  .btn-play.stop {
    background: var(--danger);
    color: white;
  }

  .btn-play.stop:hover {
    background: var(--danger-hover);
  }

  .btn-remove {
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text-secondary);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .btn-remove:hover {
    background: var(--danger);
    color: white;
    border-color: var(--danger);
  }

  .sound-type-info {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    background: var(--accent-glow);
    border-radius: var(--radius-sm);
    font-size: 12px;
    color: var(--primary);
    margin-top: 8px;
  }

  .interval-display {
    font-size: 18px;
    font-weight: 700;
    color: var(--primary);
    text-align: center;
    margin-top: 4px;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
  }

  .empty-state .icon {
    font-size: 48px;
    margin-bottom: 12px;
  }

  .empty-state p {
    font-size: 15px;
  }

  /* Interval input row */
  .interval-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .interval-row input[type="number"] {
    flex: 1;
  }

  .interval-suffix {
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 500;
    white-space: nowrap;
  }

  /* Custom sound preview */
  .preview-section {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }

  .btn-preview {
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--input-bg);
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }

  .btn-preview:hover {
    border-color: var(--primary);
    color: var(--primary);
  }

  .btn-preview:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* Settings Button */
  .settings-btn {
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-card);
    color: var(--text-secondary);
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
    line-height: 1;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .settings-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
  }

  /* Settings Panel */
  .settings-panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .settings-panel-inner {
    padding: 24px;
  }

  .settings-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .settings-header h3 {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }

  .settings-close {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text-secondary);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .settings-close:hover {
    background: var(--danger);
    color: white;
    border-color: var(--danger);
  }

  .settings-body {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .settings-body .control-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .settings-body .interval-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .settings-body .interval-row input[type="range"] {
    flex: 1;
  }

  /* Preset color buttons */
  .color-presets {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 4px;
  }

  .color-preset-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 2px solid var(--border);
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }

  .color-preset-btn:hover {
    border-color: var(--text);
    transform: scale(1.1);
  }

  .color-preset-btn.active {
    border-color: var(--text);
    box-shadow: 0 0 0 2px var(--bg-card);
  }

  .color-preset-btn.active::after {
    content: '\2713';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 14px;
    font-weight: 700;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }

  /* Custom color picker */
  .custom-color-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .custom-color-row input[type="color"] {
    width: 48px;
    height: 36px;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    background: transparent;
    padding: 2px;
  }

  .custom-color-row .color-hex {
    font-size: 13px;
    color: var(--text-secondary);
    font-family: monospace;
  }

  /* Reset button */
  .btn-reset-color {
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--input-bg);
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }

  .btn-reset-color:hover {
    border-color: var(--danger);
    color: var(--danger);
  }

  /* ===== Background Options (Settings UI) ===== */
  .bg-options {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .bg-option {
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--input-bg);
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .bg-option:hover {
    border-color: var(--primary);
    color: var(--primary);
  }

  .bg-option.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }

  /* App Footer */
  .app-footer {
    text-align: center;
    padding: 24px 0 8px;
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 500;
    letter-spacing: 0.3px;
  }

  /* Card Opacity Slider */
  .bg-opacity-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 4px;
  }

  .bg-opacity-row input[type="range"] {
    flex: 1;
    height: 6px;
    -webkit-appearance: none;
    appearance: none;
    background: var(--border);
    border-radius: 3px;
    outline: none;
  }

  .bg-opacity-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--primary);
    cursor: pointer;
    border: 2px solid var(--bg-card);
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }

  .bg-opacity-row input[type="range"]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--primary);
    cursor: pointer;
    border: 2px solid var(--bg-card);
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }

  .bg-opacity-value {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    min-width: 36px;
    text-align: right;
  }

  /* ===== Background Containers ===== */
  .bg-container {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
  }

  .bg-container > * {
    position: absolute;
  }

  /* --- Aurora Flow --- */
  .bg-aurora {
    background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);
  }

  .bg-aurora .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.55;
    will-change: transform, opacity;
  }

  .bg-aurora .orb-1 {
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, #ff0099, transparent 70%);
    top: 5%;
    left: 5%;
    animation: orbit1 25s ease-in-out infinite;
  }

  .bg-aurora .orb-2 {
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, #8b5cf6, transparent 70%);
    top: 40%;
    left: 60%;
    animation: orbit2 30s ease-in-out infinite;
  }

  .bg-aurora .orb-3 {
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, #06b6d4, transparent 70%);
    top: 60%;
    left: 10%;
    animation: orbit3 35s ease-in-out infinite;
  }

  .bg-aurora .orb-4 {
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, #d946ef, transparent 70%);
    top: 15%;
    left: 70%;
    animation: orbit4 28s ease-in-out infinite;
  }

  .bg-aurora .orb-5 {
    width: 650px;
    height: 650px;
    background: radial-gradient(circle, #f97316, transparent 70%);
    top: 70%;
    left: 45%;
    animation: orbit5 32s ease-in-out infinite;
  }

  .bg-aurora .orb-6 {
    width: 550px;
    height: 550px;
    background: radial-gradient(circle, #14b8a6, transparent 70%);
    top: 30%;
    left: 30%;
    animation: orbit6 22s ease-in-out infinite;
  }

  @keyframes orbit1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(150px, 100px) scale(1.1); }
    50% { transform: translate(50px, 200px) scale(0.95); }
    75% { transform: translate(-100px, 50px) scale(1.05); }
  }

  @keyframes orbit2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(-120px, 80px) scale(1.05); }
    50% { transform: translate(-200px, -50px) scale(0.9); }
    75% { transform: translate(-80px, -150px) scale(1.1); }
  }

  @keyframes orbit3 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(100px, -100px) scale(1.08); }
    50% { transform: translate(200px, 50px) scale(0.92); }
    75% { transform: translate(50px, 150px) scale(1.02); }
  }

  @keyframes orbit4 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(-80px, 120px) scale(1.06); }
    50% { transform: translate(100px, 80px) scale(0.94); }
    75% { transform: translate(150px, -60px) scale(1.04); }
  }

  @keyframes orbit5 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(80px, -120px) scale(1.07); }
    50% { transform: translate(-50px, -80px) scale(0.93); }
    75% { transform: translate(-150px, 40px) scale(1.03); }
  }

  @keyframes orbit6 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(120px, -60px) scale(1.04); }
    50% { transform: translate(60px, 100px) scale(0.96); }
    75% { transform: translate(-60px, 160px) scale(1.06); }
  }

  /* --- Cosmic Smoke --- */
  .bg-cosmic-smoke {
    background: radial-gradient(ellipse at 50% 50%, #0d0d1a 0%, #080812 40%, #040408 100%);
  }

  function getAudioCtx() {
    if (!state.audioCtx) {
      state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (state.audioCtx.state === 'suspended') {
      state.audioCtx.resume();
    }
    return state.audioCtx;

  function hexToRgb(hex) {
    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? {
      r: parseInt(result[1], 16),
      g: parseInt(result[2], 16),
      b: parseInt(result[3], 16)
    } : null;
  }

  function applyThemeColor(color) {
    const rgb = hexToRgb(color);
    if (!rgb) return;

    // Light mode: primary = user color, hover = 85% brightness
    const hoverR = Math.round(rgb.r * 0.85);
    const hoverG = Math.round(rgb.g * 0.85);
    const hoverB = Math.round(rgb.b * 0.85);

    // Dark mode: primary = 125% brightness (capped at 255), hover = user color
    const darkR = Math.min(255, Math.round(rgb.r * 1.25));
    const darkG = Math.min(255, Math.round(rgb.g * 1.25));
    const darkB = Math.min(255, Math.round(rgb.b * 1.25));

    // Set light mode dynamic vars
    const root = document.documentElement;
    root.style.setProperty('--primary', color);
    root.style.setProperty('--primary-hover', `rgb(${hoverR},${hoverG},${hoverB})`);
    root.style.setProperty('--accent-glow', `rgba(${rgb.r},${rgb.g},${rgb.b},0.15)`);

    // Set dark mode dynamic vars via injected style
    let darkStyle = document.getElementById('dynamic-dark-style');
    if (!darkStyle) {
      darkStyle = document.createElement('style');
      darkStyle.id = 'dynamic-dark-style';
      document.head.appendChild(darkStyle);
    }
    darkStyle.textContent = `
      [data-theme="dark"] {
        --primary: rgb(${darkR},${darkG},${darkB});
        --primary-hover: ${color};
        --accent-glow: rgba(${rgb.r},${rgb.g},${rgb.b},0.12);
        --toggle-knob: rgb(${darkR},${darkG},${darkB});

      const el = document.getElementById(id);
      if (el) el.style.display = 'block';
    }

    state.bgMode = mode;
    localStorage.setItem('sound-looper-bg', mode);

    // Update active button state
    document.querySelectorAll('.bg-option').forEach(btn => {

  // ===== Sound Playback Functions =====
  const soundPlayers = {
    snap: function(volume) {
      if (FINGER_SNAP_DATA_URL !== "data:audio/mpeg;base64,//PASTE_YOUR_BASE64_DATA_URL_HERE") {
        const audio = new Audio(FINGER_SNAP_DATA_URL);
        audio.volume = volume;
        audio.play().catch(() => {});
      }
    },

    clench: function(volume) {
      if (CLENCH_DATA_URL !== "data:audio/mpeg;base64,//PASTE_CLENCH_BASE64_HERE") {
        const audio = new Audio(CLENCH_DATA_URL);
        audio.volume = volume;
        audio.play().catch(() => {});
      }
    },

    inhale: function(volume) {
      if (INHALE_DATA_URL !== "data:audio/mpeg;base64,//PASTE_INHALE_BASE64_HERE") {
        const audio = new Audio(INHALE_DATA_URL);
        audio.volume = volume;
        audio.play().catch(() => {});
      }
    },

    custom: function(volume, audioEl) {
      if (audioEl) {
        audioEl.volume = volume;
        audioEl.currentTime = 0;
        audioEl.play().catch(() => {});
      }
    }
  };

  // ===== Loop Management =====
  function addLoop() {
    const id = state.nextId++;
    const loop = {
      id,
      soundType: 'snap',
      interval: 5.0,
      volume: 1.0,
      customUrl: '',
      customFile: null,
      customAudioEl: null,
      customMode: 'file',
      customError: null,
      running: false,
      timerId: null
    };
    state.loops.push(loop);
    renderLoops();
    return loop;
  }

  function removeLoop(id) {
    const loop = state.loops.find(l => l.id === id);
    if (loop) {
      stopLoop(loop);
      // Fully stop the custom audio element
      if (loop.customAudioEl) {
        loop.customAudioEl.pause();
        loop.customAudioEl.load();
      }
      state.loops = state.loops.filter(l => l.id !== id);
    }
    renderLoops();
  }

  function startLoop(loop) {
    if (loop.running) return;

    // Validate and create audio element for custom sounds
    if (loop.soundType === 'custom') {
      if (loop.customMode === 'url' && !loop.customUrl) {
        alert('Please provide a custom sound URL.');
        return;
      }
      if (loop.customMode === 'file' && !loop.customFile) {
        alert('Please select a local file.');
        return;
      }
      if (!loop.customAudioEl) {
        if (loop.customMode === 'url') {
          loop.customAudioEl = createAudioElement(loop.customUrl);
          loop.customAudioEl.addEventListener('error', () => {
            loop.customError = 'Failed to load audio from URL. Make sure the URL is a direct link to an audio file.';
            loop.running = false;
            if (loop.timerId) {
              clearTimeout(loop.timerId);
              loop.timerId = null;
            }
            renderLoops();
          });
        } else if (loop.customMode === 'file' && loop.customFile) {
          const url = URL.createObjectURL(loop.customFile);
          loop.customAudioEl = createAudioElement(url);
          loop.customAudioEl.addEventListener('error', () => {
            loop.customError = 'Failed to load the selected file.';
            loop.running = false;
            if (loop.timerId) {
              clearTimeout(loop.timerId);
              loop.timerId = null;
            }
            renderLoops();
          });
        }
      }
      if (!loop.customAudioEl) {
        alert('Could not load the custom sound.');
        return;
      }
    }

    loop.running = true;
    tickLoop(loop);
    renderLoops();
  }

  function stopLoop(loop) {
    loop.running = false;
    if (loop.timerId) {
      clearTimeout(loop.timerId);
      loop.timerId = null;
    }
    if (loop.customAudioEl) {
      loop.customAudioEl.pause();
      loop.customAudioEl.currentTime = 0;
      loop.customAudioEl.load();
    }
    renderLoops();
  }

  function tickLoop(loop) {
    if (!loop.running) return;

    try {
      if (loop.soundType === 'custom' && loop.customAudioEl) {
        soundPlayers.custom(loop.volume, loop.customAudioEl);
      } else {
        soundPlayers[loop.soundType](loop.volume);
      }
    } catch (e) {
      console.warn('Sound playback error:', e);
    }

    const ms = Math.max(100, loop.interval * 1000);
    loop.timerId = setTimeout(() => tickLoop(loop), ms);
  }

  function createAudioElement(url) {
    const audio = new Audio();
    audio.src = url;
    audio.volume = 1;
    audio.preload = 'auto';
    return audio;
  }

  function handleFileSelect(loop, file) {
    if (file) {
      loop.customMode = 'file';
      loop.customUrl = '';
      loop.customError = null;
      loop.customFile = file;
      const url = URL.createObjectURL(file);
      if (loop.customAudioEl) {
        loop.customAudioEl.src = url;
        if (loop.running) loop.customAudioEl.play().catch(() => {});
      } else {
        loop.customAudioEl = createAudioElement(url);
        loop.customAudioEl.addEventListener('error', () => {
          loop.customError = 'Failed to load the selected file.';
          renderLoops();
        });
        if (loop.running) loop.customAudioEl.play().catch(() => {});
      }
      renderLoops();
    }
  }

  function handleUrlChange(loop, url) {
    loop.customMode = 'url';
    loop.customFile = null;
    if (loop.customAudioEl) {
      loop.customAudioEl.pause();
      loop.customAudioEl.load();
    }
    loop.customAudioEl = null;
    loop.customError = null;
    loop.customUrl = url;
    if (url) {
      loop.customAudioEl = createAudioElement(url);
      loop.customAudioEl.addEventListener('error', () => {
        loop.customError = 'Failed to load audio. Make sure the URL is a direct link to an audio file (.mp3, .wav, .ogg, .m4a, .flac).';
        renderLoops();
      });
      loop.customAudioEl.load();
      if (loop.running) loop.customAudioEl.play().catch(() => {});
    }
  }

  function updateLoopField(loop, field, value) {
    loop[field] = value;
    renderLoops();
  }

  // ===== Rendering =====
  function renderLoops() {
    const container = document.getElementById('loopsContainer');
    const countEl = document.getElementById('loopCount');
    const iconWrapper = document.querySelector('.icon-wrapper');

    countEl.textContent = `${state.loops.length} loop${state.loops.length !== 1 ? 's' : ''}`;

    // Update icon spinning state based on active loops
    const anyRunning = state.loops.some(loop => loop.running);
    if (iconWrapper) {
      iconWrapper.classList.toggle('spinning', anyRunning);
    }

    if (state.loops.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="icon">&#x1F3B5;</div>
          <p>No sound loops yet. Click the button below to add one.</p>
        </div>
      `;
      return;
    }

    container.innerHTML = state.loops.map(loop => renderLoopCard(loop)).join('');

    // Attach event listeners
    state.loops.forEach(loop => {
      const card = document.getElementById(`loop-${loop.id}`);
      if (!card) return;

      // Sound type select
      const select = card.querySelector('[data-field="soundType"]');
      if (select) {
        select.value = loop.soundType;
        select.addEventListener('change', e => {
          loop.soundType = e.target.value;
          if (loop.soundType !== 'custom') {
            loop.customUrl = '';
            loop.customFile = null;
            loop.customAudioEl = null;
            loop.customMode = 'file';
          }
          renderLoops();
        });
      }

      // Interval input
      const intervalInput = card.querySelector('[data-field="interval"]');
      if (intervalInput) {
        intervalInput.value = loop.interval;
        intervalInput.addEventListener('input', e => {
          loop.interval = parseFloat(e.target.value) || 0.1;
          if (loop.interval < 0.1) loop.interval = 0.1;
          renderLoops();
        });
      }

      // Volume range
      const volumeRange = card.querySelector('[data-field="volume"]');
      if (volumeRange) {
        volumeRange.value = loop.volume * 100;
        volumeRange.addEventListener('input', e => {
          loop.volume = parseInt(e.target.value) / 100;
          const volDisplay = card.querySelector('[data-field="volumeValue"]');
          if (volDisplay) volDisplay.textContent = `${loop.volume * 100}%`;
        });
      }

      // Custom URL input
      const urlInput = card.querySelector('[data-field="customUrl"]');
      if (urlInput) {
        urlInput.value = loop.customUrl || '';
        urlInput.addEventListener('input', e => handleUrlChange(loop, e.target.value));
      }

      // File input
      const fileInput = card.querySelector('[data-field="customFile"]');
      if (fileInput) {
        fileInput.addEventListener('change', e => {
          const file = e.target.files[0];
          handleFileSelect(loop, file);
        });
      }

      // Mode toggle buttons
      const modeUrlBtn = card.querySelector('[data-field="modeUrl"]');
      if (modeUrlBtn) {
        modeUrlBtn.addEventListener('click', () => {
          loop.customMode = 'url';
          loop.customFile = null;
          if (loop.customAudioEl) {
            loop.customAudioEl.pause();
            loop.customAudioEl.load();
          }
          loop.customAudioEl = null;
          loop.customError = null;
          if (loop.customUrl) {
            loop.customAudioEl = createAudioElement(loop.customUrl);
            loop.customAudioEl.load();
            if (loop.running) loop.customAudioEl.play().catch(() => {});
          }
          renderLoops();
        });
      }

      const modeFileBtn = card.querySelector('[data-field="modeFile"]');
      if (modeFileBtn) {
        modeFileBtn.addEventListener('click', () => {
          loop.customMode = 'file';
          loop.customUrl = '';
          if (loop.customAudioEl) {
            loop.customAudioEl.pause();
            loop.customAudioEl.load();
          }
          loop.customAudioEl = null;
          loop.customError = null;
          renderLoops();
        });
      }

      // Play/Stop button
      const playBtn = card.querySelector('[data-field="playBtn"]');
      if (playBtn) {
        playBtn.addEventListener('click', () => {
          if (loop.running) {
            stopLoop(loop);
          } else {
            startLoop(loop);
          }
        });
      }

      // Remove button
      const removeBtn = card.querySelector('[data-field="removeBtn"]');
      if (removeBtn) {
        removeBtn.addEventListener('click', () => removeLoop(loop.id));
      }

    });
  }

  function renderLoopCard(loop) {
    const statusClass = loop.running ? 'running' : '';
    const statusText = loop.running ? 'Playing' : 'Stopped';
    const btnClass = loop.running ? 'stop' : 'start';
    const btnText = loop.running ? '&#x23F8; Stop' : '&#x25B6; Start';

    const soundOptions = [
      { value: 'snap', label: '&#x1FAF0; Finger Snap' },
      { value: 'inhale', label: '&#x1F443; Inhale Slut' },
      { value: 'clench', label: '&#x1F4A6; Clench Hard' },
      { value: 'custom', label: '&#x1F4C1; Custom Sound' }
    ];

    const optionsHtml = soundOptions.map(opt =>
      `<option value="${opt.value}" ${loop.soundType === opt.value ? 'selected' : ''}>${opt.label}</option>`
    ).join('');

    const customSection = loop.soundType === 'custom' ? `
      <div class="custom-url-row">
        <div class="custom-mode-toggle">
          <button class="custom-mode-btn ${loop.customMode === 'file' ? 'active' : ''}" data-field="modeFile">File</button>
          <button class="custom-mode-btn ${loop.customMode === 'url' ? 'active' : ''}" data-field="modeUrl">URL</button>
        </div>
        ${loop.customMode === 'url' ? `
          <input type="text" data-field="customUrl" placeholder="Paste sound URL here..." value="${escapeAttr(loop.customUrl)}">
          <div class="custom-info"><span class="label">Supported:</span> Direct audio file URLs (.mp3, .wav, .ogg, .m4a, .flac). No YouTube or streaming pages.</div>
        ` : `
          <label class="file-label">
            &#x1F4C1; Choose local file
            <input type="file" data-field="customFile" accept="audio/*">
          </label>
          ${loop.customFile ? `<div class="file-name">&#x1F517; ${escapeHtml(loop.customFile.name)}</div>` : ''}
        `}
        ${loop.customError ? `<div class="custom-error">${escapeHtml(loop.customError)}</div>` : ''}
      </div>
    ` : '';

    const soundInfo = loop.soundType === 'snap' ? 'Finger snap sound' :
                      loop.soundType === 'clench' ? '"Clench hard" female voice sound' :
                      loop.soundType === 'inhale' ? '"Inhale, slut" female voice sound' :
                      'Custom sound — local file or direct URL (.mp3, .wav, .ogg, .m4a)';

    return `
      <div class="loop-card ${statusClass}" id="loop-${loop.id}">
        <div class="loop-header">
          <span class="loop-title">Loop #${loop.id}</span>
          <div class="loop-status">
            <span class="status-dot"></span>
            <span>${statusText}</span>
          </div>
        </div>

        <div class="loop-controls">
          <div class="control-group">
            <label>Sound</label>
            <select data-field="soundType">${optionsHtml}</select>
            <div class="sound-type-info">&#x2139;&#xFE0F; ${soundInfo}</div>
            ${customSection}
          </div>

          <div class="control-group">
            <label>Interval</label>
            <div class="interval-row">
              <input type="number" data-field="interval" min="0.1" step="0.1" value="${loop.interval}" placeholder="3.0">
              <span class="interval-suffix">seconds</span>
            </div>
            <div class="interval-display">${loop.interval}s</div>
          </div>

          <div class="control-group">
            <label>Volume</label>
            <div class="volume-row">
              <input type="range" data-field="volume" min="0" max="100" value="${loop.volume * 100}">
              <span class="volume-value" data-field="volumeValue">${Math.round(loop.volume * 100)}%</span>
            </div>
          </div>
        </div>

        <div class="loop-actions">
          <button class="btn-play ${btnClass}" data-field="playBtn">${btnText}</button>
          <button class="btn-remove" data-field="removeBtn">&#x2715;</button>
        </div>
      </div>
    `;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function escapeAttr(str) {
    return str.replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // ===== Theme Toggle =====
  function initTheme() {
    const savedColor = localStorage.getItem('sound-looper-theme-color') || '#ff0099';
    const savedBg = localStorage.getItem('sound-looper-bg') || 'aurora';
    const savedOpacity = parseInt(localStorage.getItem('sound-looper-opacity'), 10) || 70;

    // Apply saved accent color
    applyThemeColor(savedColor);
    state.themeColor = savedColor;

    // Apply saved background
    applyBackground(savedBg);

    // Apply saved opacity
    applyBgOpacity(savedOpacity);
  }

  // ===== Settings Panel =====
  function setupSettingsPanel() {
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsPanel = document.getElementById('settingsPanel');
    const settingsClose = document.getElementById('settingsClose');
    const colorPresets = document.getElementById('colorPresets');
    const customPicker = document.getElementById('customColorPicker');
    const hexDisplay = document.getElementById('colorHexDisplay');
    const resetBtn = document.getElementById('resetColorBtn');

    // Toggle panel visibility
    if (settingsBtn) {
      settingsBtn.addEventListener('click', () => {
        settingsPanel.style.display = settingsPanel.style.display === 'none' ? 'block' : 'none';
      });
    }
    if (settingsClose) {
      settingsClose.addEventListener('click', () => {
        settingsPanel.style.display = 'none';
      });
    }

    // Preset color buttons
    if (colorPresets) {
      colorPresets.addEventListener('click', (e) => {
        const btn = e.target.closest('.color-preset-btn');
        if (!btn) return;
        const color = btn.dataset.color;
        applyThemeColor(color);
        state.themeColor = color;
        localStorage.setItem('sound-looper-theme-color', color);
        // Update active state
        colorPresets.querySelectorAll('.color-preset-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        customPicker.value = color;
        hexDisplay.textContent = color;
      });
    }

    // Custom color picker
    if (customPicker) {
      customPicker.addEventListener('input', (e) => {
        const color = e.target.value;
        applyThemeColor(color);
        state.themeColor = color;
        localStorage.setItem('sound-looper-theme-color', color);
        // Update active state
        colorPresets.querySelectorAll('.color-preset-btn').forEach(b => b.classList.remove('active'));
        hexDisplay.textContent = color;
      });
    }

    // Reset button
    if (resetBtn) {
      resetBtn.addEventListener('click', () => {
        applyThemeColor('#ff0099');
        state.themeColor = '#ff0099';
        localStorage.setItem('sound-looper-theme-color', '#ff0099');
        // Update active state
        colorPresets.querySelectorAll('.color-preset-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.color === '#ff0099');
        });
        customPicker.value = '#ff0099';
        hexDisplay.textContent = '#ff0099';
      });
    }

    // Background options
    const bgOptions = document.getElementById('bgOptions');
    if (bgOptions) {
      bgOptions.addEventListener('click', (e) => {
        const btn = e.target.closest('.bg-option');
        if (!btn) return;
        applyBackground(btn.dataset.bg);
      });
    }

    // Transparency slider
    const opacitySlider = document.getElementById('bgOpacitySlider');
    if (opacitySlider) {
      opacitySlider.addEventListener('input', (e) => {
        applyBgOpacity(parseInt(e.target.value, 10));
      });
    }
  }

  // ===== Init =====
  function init() {
    initTheme();
    setupSettingsPanel();

    document.getElementById('addLoopBtn').addEventListener('click', () => {
      addLoop();
    });

    renderLoops();
  }

  // Wait for DOM ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
